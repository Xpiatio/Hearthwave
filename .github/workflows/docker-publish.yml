name: Build and publish Docker images

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to publish (e.g. v2.5.2)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/xpiatio/hearthwave-backend
  FRONTEND_IMAGE: ghcr.io/xpiatio/hearthwave-frontend

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        compute:
          - backend: cpu
            suffix: ""
          - backend: cuda
            suffix: "-cuda"
          - backend: rocm
            suffix: "-rocm"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The ROCm torch wheels put this image around 20GB, which does not fit in
      # the ~14GB free on a stock runner. Drop preinstalled toolchains we never
      # use to reclaim roughly 30GB. cpu and cuda already fit, so skip it there.
      - name: Free disk space
        if: matrix.compute.backend == 'rocm'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Build and push backend (${{ matrix.compute.backend }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          build-args: COMPUTE_BACKEND=${{ matrix.compute.backend }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ inputs.version || github.ref_name }}${{ matrix.compute.suffix }}
            ${{ env.BACKEND_IMAGE }}:latest${{ matrix.compute.suffix }}
          cache-from: type=gha,scope=backend-${{ matrix.compute.backend }}
          # mode=max on rocm would push well past the 10GB repo-wide GHA cache
          # limit and LRU-evict the cpu/cuda caches, so cache only the final
          # layers there.
          cache-to: type=gha,mode=${{ matrix.compute.backend == 'rocm' && 'min' || 'max' }},scope=backend-${{ matrix.compute.backend }}

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ inputs.version || github.ref_name }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
